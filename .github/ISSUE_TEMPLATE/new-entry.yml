name: 提交一个新词条
description: 推荐一篇论文、一个系统、一个概念、数据集或基准，并说明为什么值得收录。
title: "[新词条] "
body:
  - type: markdown
    attributes:
      value: |
        谢谢你来补这块地图。请尽量使用一手来源；如果你使用了 AI 辅助写作，请在下方说明。

        **提交前请先搜索，避免重复推荐。** 编辑会在 Issue 中核对来源，再整理进 `assets/js/data.js`。

  - type: input
    id: entry_name
    attributes:
      label: 词条名称
      description: 论文、系统或概念的正式名称。
      placeholder: 例如 Diffusion Policy / π0 / ObjectNav
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: 所属领域
      options:
        - 导航 Navigation
        - 操作 Manipulation
        - 移动操作 Loco-Manipulation
        - 仿真器 Simulation
        - 数据与评测 Data & Evaluation
        - 不确定 / 需要讨论
    validations:
      required: true

  - type: input
    id: route
    attributes:
      label: 技术路线
      description: 站内已有路线可直接写名称；如果是新路线，请说明它与现有路线的关系。
      placeholder: 例如：模仿学习 / VLA / UMI 数据 / EGO 数据 / 具身智能体 Harness
    validations:
      required: false

  - type: dropdown
    id: entry_type
    attributes:
      label: 词条类型
      options:
        - 论文
        - 系统 / 项目
        - 概念
        - 数据集
        - 基准
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: 年份
      placeholder: "2024"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 一句话概述
      description: 它解决什么问题？用一句人话说明。
      placeholder: 它是什么，又为什么值得被放进这张地图？
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么重要
      description: 它在领域中的位置，改变了什么，或连接了哪些原本分离的问题。
    validations:
      required: true

  - type: input
    id: primary_link
    attributes:
      label: 一手来源链接
      description: 论文、官方项目页、代码仓库或作者博客，优先使用官方链接。
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 关键证据与边界
      description: 有哪些关键结果？在什么条件下成立？失败模式或未验证的假设是什么？
      placeholder: 请注明评测条件，不要把 demo 当作完整证据。

  - type: textarea
    id: references
    attributes:
      label: 其他参考与延伸
      description: 一篇文章、一段复现记录、一个相关词条都可以。

  - type: input
    id: contributor
    attributes:
      label: 你的 GitHub 昵称或署名
      placeholder: "@your-handle（可选）"

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索过现有词条，确认不是重复推荐。
          required: true
        - label: 我提供的链接真实可访问，且没有编造引用、作者或数字。
          required: true
        - label: 我已区分事实与个人判断；如使用 AI 辅助，已在上方说明。
          required: true

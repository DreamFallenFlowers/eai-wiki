name: 建议修订一个词条
description: 报告事实错误、补充遗漏、更新过时信息，或提出更清楚的解释。
title: "[修订] "
body:
  - type: markdown
    attributes:
      value: |
        谢谢纠错。请尽量写清楚「哪里不对」以及「依据是什么」，这样编辑可以直接核对。

  - type: input
    id: entry
    attributes:
      label: 词条名称或链接
      description: 站内词条名称，或页面的完整链接。
      placeholder: 例如 OpenVLA 或 https://…/#/entry/openvla
    validations:
      required: true

  - type: input
    id: route
    attributes:
      label: 所属领域 / 技术路线
      description: 如果问题涉及词条归位或路线划分，请写在这里。
      placeholder: 例如：manipulation / VLA，data / EGO 数据
    validations:
      required: false

  - type: dropdown
    id: kind
    attributes:
      label: 修订类型
      options:
        - 事实错误
        - 过时信息
        - 缺失的关键工作
        - 引用 / 元数据错误
        - 表述与结构改进
        - 补充失败模式或边界
        - 其他
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 当前内容哪里有问题？
      description: 粘贴原句或描述位置，方便定位。
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: 建议如何修改？
      description: 可以直接给出替换文字，但请附上依据。
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: 依据
      description: 论文、官方文档、代码、实验记录等一手来源。
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: contributor
    attributes:
      label: 你的 GitHub 昵称或署名
      placeholder: "@your-handle（可选）"

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已经核对过原始来源，链接真实可访问。
          required: true
        - label: 我清楚这是一份公开的修订建议，而不是对原作者的人身评价。
          required: true

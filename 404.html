<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>页面不存在 · EAI Wiki</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root { --paper:#f2efe6; --ink:#141414; --orange:#ff4b1f; --muted:#68645b; --mono:"Cascadia Code",Consolas,monospace; --serif:"Iowan Old Style","Songti SC","SimSun",Georgia,serif; --sans:"PingFang SC","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font-family:var(--sans); background-image:linear-gradient(to right,rgba(20,20,20,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(20,20,20,.05) 1px,transparent 1px); background-size:84px 84px; }
    .wrap { width:min(880px,100%); }
    .top { display:flex; justify-content:space-between; gap:20px; font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }
    .brand { display:flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; font-family:var(--sans); font-weight:800; font-size:20px; letter-spacing:-.05em; }
    .brand i { width:32px; height:32px; display:grid; place-items:center; border-radius:7px; background:var(--ink); color:var(--paper); font-family:var(--serif); font-size:17px; font-style:normal; }
    main { margin-top:14vh; border-top:1px solid rgba(20,20,20,.2); padding-top:38px; }
    p.kicker { margin:0 0 22px; font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--orange); }
    h1 { margin:0; font-family:var(--serif); font-size:clamp(54px,10vw,124px); font-weight:500; line-height:.92; letter-spacing:-.07em; }
    h1 em { color:var(--orange); font-style:normal; }
    main > p { max-width:520px; margin:28px 0 0; color:var(--muted); font-size:14px; line-height:1.9; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:28px; }
    a.btn { display:inline-flex; padding:12px 17px; border:1px solid var(--ink); color:var(--ink); text-decoration:none; font-size:12px; font-weight:600; }
    a.btn.primary { background:var(--ink); color:var(--paper); }
    a.btn:hover { background:var(--orange); border-color:var(--orange); color:var(--ink); }
    .path { margin-top:40px; font-family:var(--mono); font-size:9px; color:var(--muted); opacity:.65; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><a class="brand" href="./"><i>E</i>EAI WIKI</a><span>404 / LOST IN LATENT SPACE</span></div>
    <main>
      <p class="kicker">NO NODE HERE / 无法定位</p>
      <h1>这个节点<br><em>还没有连上。</em></h1>
      <p>你要找的页面不存在，可能被重命名，也可能还停留在某个未合并的 Issue 里。回到已知的世界，或者把它写出来。</p>
      <div class="actions">
        <a class="btn primary" href="./">回到领域地图 →</a>
        <a class="btn" href="./#/entries">浏览词条库</a>
        <a class="btn" href="./#/contribute">贡献一个词条</a>
      </div>
      <p class="path" id="path"></p>
    </main>
  </div>
  <script>document.getElementById('path').textContent = 'REQUEST / ' + location.pathname + location.hash;</script>
</body>
</html>
